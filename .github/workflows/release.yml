name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release with Gradle
        run: ./gradlew assembleRelease

      - name: Get tag ame
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          # the CHANGELOG.md heading must contain the tag name, e.g. "## v0.2.0 - ..."
          awk -v tag="${VERSION_TAG}" '
            $0 ~ ("^## .*" tag) {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release_body.md
          test -s release_body.md || { echo "No changelog section for ${VERSION_TAG} found" >&2; exit 1; }

      - name: Sign apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Copy build artifacts
        run: |
          set -e

          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          {
            echo ""
            echo "### Checksums"
            echo ""
            echo "| Variant | SHA-256 |"
            echo "| ------- | ------- |"
          } >> release_body.md

          printf "%s\n" "${apks[@]}" | xargs -n 1 -I {} sh -c '
          cp app/build/outputs/apk/release/app-{}-release-unsigned-signed.apk mpvKt-{}-${{ env.VERSION_TAG }}.apk
          sha=$(sha256sum mpvKt-{}-${{ env.VERSION_TAG }}.apk | awk '\''{ print $1 }'\'')
          echo "apk-{}-sha256=$sha" >> $GITHUB_ENV
          echo "| {} | $sha |" >> release_body.md'

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvKt ${{ env.VERSION_TAG }}
          body_path: release_body.md
          files: |
            mpvKt-universal-${{ env.VERSION_TAG }}.apk
            mpvKt-arm64-v8a-${{ env.VERSION_TAG }}.apk
            mpvKt-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            mpvKt-x86-${{ env.VERSION_TAG }}.apk
            mpvKt-x86_64-${{ env.VERSION_TAG }}.apk
          prerelease: false
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}